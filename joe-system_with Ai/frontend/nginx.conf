server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets get a modest cache. Filenames aren't hash-busted in this
    # project, so if you ship a CSS/JS change, a hard refresh (or bumping a
    # "?v=" query string) is enough to see it — no need to fight this cache.
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Reverse proxy to the backend container so the browser only ever talks
    # to ONE origin (this nginx). frontend/js/config.js already resolves to
    # a same-origin "/api" path whenever the URL has no explicit port (rule
    # #3), which is exactly the case here — zero frontend config needed.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
