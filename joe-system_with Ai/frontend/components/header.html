<header class="topbar">
  <label class="topbar__search">
    <span aria-hidden="true">⌕</span>
    <input type="search" placeholder="Search..." aria-label="Search" />
  </label>

  <div class="topbar__actions">
    <span aria-hidden="true">?</span>
    <span aria-hidden="true">🔔</span>
    <div class="topbar__user">
      <span class="sidebar__avatar" style="background:var(--indigo-accent-soft); color:var(--indigo-accent);">👤</span>
      <span id="topbar-user-email">Signed in</span>
    </div>
    <button class="topbar__logout" id="logout-btn" type="button" title="Log out">Logout</button>
  </div>
</header>
