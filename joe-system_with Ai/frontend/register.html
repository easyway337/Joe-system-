<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus — Create account</title>

  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/crm.css" />
  <link rel="stylesheet" href="css/auth.css" />

  <script src="js/supabase-config.js"></script>
</head>
<body>

  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-brand">
        <span class="auth-brand-mark">N</span>
        <span class="auth-brand-name">Nexus</span>
      </div>

      <h1>Create your account</h1>
      <p class="auth-sub">Set up access to your CRM &amp; ERP workspace.</p>

      <div class="auth-message" id="auth-message"></div>

      <form class="auth-form" id="register-form">
        <div class="form-field">
          <label for="register-email">Email</label>
          <input type="email" id="register-email" name="email" required autocomplete="email" />
        </div>
        <div class="form-field">
          <label for="register-password">Password</label>
          <input type="password" id="register-password" name="password" required minlength="6" autocomplete="new-password" />
        </div>
        <div class="form-field">
          <label for="register-password-confirm">Confirm password</label>
          <input type="password" id="register-password-confirm" name="password_confirm" required minlength="6" autocomplete="new-password" />
        </div>
        <button type="submit" class="btn-primary auth-submit" id="register-submit">Create account</button>
      </form>

      <p class="auth-footer">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>

  <script type="module" src="js/register.js"></script>
</body>
</html>
