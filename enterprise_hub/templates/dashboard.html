{% extends 'base.html' %}

{% block content %}
<div class="row mb-4">
    <!-- كارت إجمالي المبيعات -->
    <div class="col-md-4 mb-3">
        <div class="card kpi-card shadow-sm border-0">
            <div class="card-body d-flex align-items-center">
                <div class="icon-box bg-orange-light text-orange me-3">
                    <i class="fa-solid fa-money-bill-wave fa-2x"></i>
                </div>
                <div>
                    <h6 class="text-muted mb-1">إجمالي المبيعات</h6>
                    <h3 class="fw-bold mb-0" id="totalRevenue">جاري التحميل...</h3>
                </div>
            </div>
        </div>
    </div>
    
    <!-- كارت العملاء المحتملين -->
    <div class="col-md-4 mb-3">
        <div class="card kpi-card shadow-sm border-0">
            <div class="card-body d-flex align-items-center">
                <div class="icon-box bg-dark-light text-dark me-3">
                    <i class="fa-solid fa-users fa-2x"></i>
                </div>
                <div>
                    <h6 class="text-muted mb-1">العملاء المحتملين (Leads)</h6>
                    <h3 class="fw-bold mb-0" id="totalLeads">جاري التحميل...</h3>
                </div>
            </div>
        </div>
    </div>
    
    <!-- كارت تنبيهات المخزون -->
    <div class="col-md-4 mb-3">
        <div class="card kpi-card shadow-sm border-0">
            <div class="card-body d-flex align-items-center">
                <div class="icon-box bg-danger-light text-danger me-3">
                    <i class="fa-solid fa-triangle-exclamation fa-2x"></i>
                </div>
                <div>
                    <h6 class="text-muted mb-1">نواقص المخزون</h6>
                    <h3 class="fw-bold mb-0" id="lowStockItems">جاري التحميل...</h3>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- صف الرسومات البيانية -->
<div class="row">
    <!-- رسم بياني: حالة العملاء -->
    <div class="col-md-6 mb-4">
        <div class="card shadow-sm border-0 h-100">
            <div class="card-header bg-white border-0 pt-4 pb-0">
                <h6 class="fw-bold">تحليل حالات العملاء (CRM)</h6>
            </div>
            <div class="card-body">
                <canvas id="leadsChart"></canvas>
            </div>
        </div>
    </div>
    
    <!-- رسم بياني: المخزون -->
    <div class="col-md-6 mb-4">
        <div class="card shadow-sm border-0 h-100">
            <div class="card-header bg-white border-0 pt-4 pb-0">
                <h6 class="fw-bold">كميات المنتجات في المخزن (ERP)</h6>
            </div>
            <div class="card-body">
                <canvas id="stockChart"></canvas>
            </div>
        </div>
    </div>
</div>
{% endblock %}
